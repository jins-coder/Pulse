<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
    <defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f43f5e" />
            <stop offset="50%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#fbbf24" />
        </linearGradient>
        <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#f43f5e" flood-opacity="0.45"/>
        </filter>
    </defs>
    
    <!-- Icon Container -->
    <g transform="translate(10, 10)">
        <rect width="100" height="100" rx="26" fill="#120a1f" stroke="rgba(244, 63, 94, 0.45)" stroke-width="2.5" />
        <path d="M 22 55 L 36 55 L 47 22 L 61 80 L 73 42 L 81 55 L 89 55" 
              fill="none" 
              stroke="url(#logoGradient)" 
              stroke-width="7.5" 
              stroke-linecap="round" 
              stroke-linejoin="round" 
              filter="url(#logoGlow)" />
        <circle cx="61" cy="80" r="4.5" fill="#f43f5e" />
        <circle cx="47" cy="22" r="4.5" fill="#fbbf24" />
    </g>

    <!-- Typography Wordmark -->
    <g transform="translate(130, 20)">
        <!-- "PULSE" Title -->
        <text x="0" y="52" 
              font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
              font-size="48" 
              font-weight="900" 
              letter-spacing="1.5" 
              fill="#fdf4ff">
            PULSE
        </text>
        
        <!-- "PHP" Pill Badge -->
        <g transform="translate(180, 18)">
            <rect width="68" height="32" rx="8" fill="rgba(244, 63, 94, 0.18)" stroke="rgba(244, 63, 94, 0.6)" stroke-width="1.5"/>
            <text x="14" y="22" 
                  font-family="'JetBrains Mono', 'Fira Code', monospace" 
                  font-size="16" 
                  font-weight="800" 
                  fill="#fb7185">
                PHP
            </text>
        </g>
        
        <!-- Subtitle / Tagline -->
        <text x="2" y="82" 
              font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
              font-size="16" 
              font-weight="600" 
              letter-spacing="0.5" 
              fill="#c4b5fd">
            Next-Gen Full-Stack Application Framework
        </text>
    </g>
</svg>
