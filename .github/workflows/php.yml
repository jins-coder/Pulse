name: Pulse Framework CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, json
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Verify CLI Syntax
        run: php bin/pulse routes

      - name: Run Core Suite
        run: |
          php -r "require 'src/Pulse.php'; echo 'Pulse Core v' . Pulse\Pulse::VERSION . ' initialized successfully' . PHP_EOL;"
